[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-audit"
version = "0.1.0"
description = "A staged, read-only, multi-model audit of a code repository"
requires-python = ">=3.9"
dependencies = ["tomli; python_version < '3.11'"]

[project.scripts]
repo-audit = "repo_audit.cli:main"

[tool.setuptools]
packages = ["repo_audit"]

[tool.setuptools.package-data]
repo_audit = ["prompts/*.md"]
